<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    (function() {
      var basePath = '/TNTCPA';
      var savedLang = localStorage.getItem('preferred-language');
      if (savedLang === 'en') {
        window.location.href = basePath + '/en/index.html';
      } else if (savedLang === 'zh') {
        window.location.href = basePath + '/tc/index.html';
      } else {
        var browserLang = navigator.language || navigator.userLanguage;
        if (browserLang.startsWith('en')) {
          window.location.href = basePath + '/en/index.html';
        } else {
          window.location.href = basePath + '/tc/index.html';
        }
      }
    })();
  </script>
</head>
<body>Loading...</body>
</html>
