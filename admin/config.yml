backend:
  name: github
  repo: https://wincy0825.github.io/TNTCPA/ # Replace with your GitHub repository (e.g., username/accounting-website)
  branch: main # Branch to update (e.g., main or master)

# This allows saving drafts before publishing
publish_mode: editorial_workflow

# Media folder configuration
media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "site_settings"
    label: "网站设置 (Site Settings)"
    files:
      - name: "general"
        label: "全局设置 (General)"
        file: "_data/settings.json"
        description: "编辑网站通用信息，包括公司简介、联系方式、Logo、首页横幅和地图"
        fields:
          - { label: "公司 Logo (Company Logo)", name: "company_logo", widget: "image", required: false, hint: "上传公司 Logo，将显示在导航栏左上角" }
          - { label: "公司简介 (中文)", name: "company_intro_zh", widget: "markdown", hint: "显示在首页的关于我们部分 (中文)" }
          - { label: "公司简介 (English)", name: "company_intro_en", widget: "markdown", hint: "显示在首页的关于我们部分 (English)" }
          - { label: "联系电话 (Phone)", name: "phone", widget: "string", hint: "例如: (852) 1234-5678" }
          - { label: "电子邮箱 (Email)", name: "email", widget: "string", hint: "例如: info@zhuoxincpa.com" }
          - { label: "WhatsApp 链接 (WhatsApp Link)", name: "whatsapp_link", widget: "string", hint: "例如: https://wa.me/85212345678" }
          - { label: "Google Map Iframe URL", name: "google_map_iframe", widget: "string", hint: "从 Google Maps 获取的嵌入式地图 iframe 的 src 属性值" }

      - name: "homepage_hero"
        label: "首页横幅 (Homepage Hero)"
        file: "_data/homepage_hero.json"
        description: "编辑首页顶部横幅内容和背景图片"
        fields:
          - { label: "横幅背景图片 (Banner Image)", name: "banner_image", widget: "image", hint: "上传首页横幅背景图片" }
          - { label: "副标题 (中文)", name: "hero_subtitle_zh", widget: "string" }
          - { label: "副标题 (English)", name: "hero_subtitle_en", widget: "string" }
          - { label: "主标题 (中文)", name: "hero_title_zh", widget: "string" }
          - { label: "主标题 (English)", name: "hero_title_en", widget: "string" }
          - { label: "描述 (中文)", name: "hero_description_zh", widget: "text" }
          - { label: "描述 (English)", name: "hero_description_en", widget: "text" }

  - name: "services"
    label: "服务项目 (Services)"
    folder: "_data/services"
    create: true
    slug: "{{slug}}"
    i18n: true # Enable i18n for this collection
    fields:
      - { label: "服务标题 (Title)", name: "title", widget: "string", i18n: true }
      - { label: "服务描述 (Description)", name: "description", widget: "markdown", i18n: true }
      - { label: "图标 (Icon)", name: "icon", widget: "string", hint: "输入 Emoji，例如: 📊, 🏢, 📋" }
      - { label: "服务图片 (Service Image)", name: "service_image", widget: "image", required: false, hint: "上传与服务相关的图片" }
      - { label: "排序 (Order)", name: "order", widget: "number", value_type: "int", hint: "数字越小越靠前" }
